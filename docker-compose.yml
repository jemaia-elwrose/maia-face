# docker compose up --build                 # broker + face worker (CPU, OpenCV backend)
# docker compose up --scale face=3          # more workers
# docker compose run --rm cli enroll "Alice" /data/alice1.jpg /data/alice2.jpg
# docker compose --profile attributes up    # + MiVOLO age/gender on GPU (checkpoint in ./models)
x-face: &face
  build: { context: ., dockerfile: docker/Dockerfile }
  environment:
    MAIA_BROKER: tcp://broker:5556
  volumes:
    - face-weights:/weights          # downloaded once
    - ./data:/data                   # gallery.db and your images
  restart: unless-stopped

services:
  broker:
    <<: *face
    command: ["maia-infer", "broker"]
    ports: ["5555:5555"]
    volumes: []
    healthcheck:
      test: ["CMD", "maia-infer", "ping", "--endpoint", "tcp://localhost:5555"]
      interval: 10s
      timeout: 3s
      retries: 3

  face:
    <<: *face
    command: ["maia-infer", "worker", "face", "--max-batch", "8"]
    depends_on: [broker]

  face-attr:
    build: { context: ., dockerfile: docker/Dockerfile.attributes }
    profiles: [attributes]
    command: ["maia-infer", "worker", "face-attr", "--max-batch", "16",
              "--opt", "checkpoint=/models/${MIVOLO_CHECKPOINT:-mivolo.pth.tar}"]
    environment:
      MAIA_BROKER: tcp://broker:5556
    volumes: ["./models:/models:ro"]
    depends_on: [broker]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  cli:
    <<: *face
    profiles: [tools]
    restart: "no"
    entrypoint: ["maia-face"]

volumes:
  face-weights:
